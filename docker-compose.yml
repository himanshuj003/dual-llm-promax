version: "3.8"

services:
  dual-llm:
    build: .
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      - XAI_API_KEY=${XAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    restart: unless-stopped
    # Uncomment if you want to use local Ollama on host
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
